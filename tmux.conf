set -g mouse on
set -s escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g status-right-length 100
set -g status-right '#{?@zsh_vi_mode,#[reverse] VI #{@zsh_vi_mode} #[default] ,}#H | %Y-%m-%d %H:%M'

# automatically set window title
setw -g automatic-rename

# split panes using | and -, preserving current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new window also inherits cwd
bind c new-window -c "#{pane_current_path}"

# reload the config file
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

setw -g mode-keys vi
setw -g copy-mode-line-numbers relative
setw -g copy-mode-selection-style 'fg=black,bg=cyan'
setw -g copy-mode-match-style 'fg=black,bg=yellow'
setw -g copy-mode-current-match-style 'fg=white,bg=red,bold'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection }

set -g history-limit 100000
set -g pane-scrollbars modal

# Show enough context to distinguish long-running agent panes.
set -g pane-border-status top
set -g pane-border-format "#{?@zsh_vi_mode,#[reverse] #{@zsh_vi_mode} #[default] ,}#[bold,fg=colour232,bg=colour220] #{pane_index} #[default] #{?pane_active,●,#{?#{||:#{m/r:^(⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏),#{pane_title}},#{==:#{@pane_state},running}},▶,■}} #{=/40/…:pane_title}#{?#{m:*#{b:pane_current_path},#{pane_title}},, · #{b:pane_current_path}} · #{pane_current_command}#{?window_zoomed_flag, ⛶,} "
set -g pane-active-border-style "fg=green"
set -g pane-border-style "#{?#{||:#{m/r:^(⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏),#{pane_title}},#{==:#{@pane_state},running}},fg=colour214,#{?#{||:#{pane_dead},#{==:#{@pane_state},done},#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}}},fg=colour196,fg=colour214}}"
bind T command-prompt -p "pane title:" "select-pane -T '%%'"

# Open a temporary shell without disturbing the current layout.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}"

# Alt-number jumps straight to pane N, no prefix
bind-key -n M-0 select-pane -t :.0
bind-key -n M-1 select-pane -t :.1
bind-key -n M-2 select-pane -t :.2
bind-key -n M-3 select-pane -t :.3
bind-key -n M-4 select-pane -t :.4
bind-key -n M-5 select-pane -t :.5
bind-key -n M-6 select-pane -t :.6
bind-key -n M-7 select-pane -t :.7
bind-key -n M-8 select-pane -t :.8
bind-key -n M-9 select-pane -t :.9
