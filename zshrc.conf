# --- Paths ---
export PATH="$HOME/.local/bin:$PATH"
# User-installed Python command-line tools (including ranger).
export PATH="$HOME/Library/Python/3.12/bin:$PATH"

# --- Oh My Zsh ---
export ZSH="$HOME/.oh-my-zsh"
ZSH_THEME="robbyrussell"
plugins=(git)
source $ZSH/oh-my-zsh.sh

# --- History (from macos.zsh) ---
HISTSIZE=1000000
SAVEHIST=1000000
setopt APPEND_HISTORY
setopt COMPLETE_IN_WORD

# --- Helpers (from macos.zsh) ---
path() {
  if (( $# != 1 )); then
    print -u2 'usage: path <file>'
    return 2
  fi
  if [[ ! -e "$1" && ! -L "$1" ]]; then
    print -u2 -- "path: no such file or directory: $1"
    return 1
  fi
  command realpath -- "$1"
}

# --- Aliases ---
alias clip='tmux load-buffer -w -'
alias h='history 1 | grep'
# Update the notes repository and switch to its master bookmark.
alias slup='sl pull && sl goto master'
# Ranger: leave the shell in Ranger's last directory.
alias rr='ranger --choosedir=$HOME/.rangerdir; LASTDIR=$(cat $HOME/.rangerdir); cd "$LASTDIR"'

# --- Vi-style command-line editing and cursor feedback (from macos.zsh) ---
bindkey -v
export KEYTIMEOUT=1
autoload -Uz edit-command-line
zle -N edit-command-line
bindkey -M vicmd v edit-command-line

_vi_cursor_shape() {
  local vi_mode
  case "$KEYMAP" in
    vicmd)
      printf '\e[2 q'
      vi_mode=N
      ;;
    *)
      printf '\e[6 q'
      vi_mode=I
      ;;
  esac
  if [[ -n "$TMUX_PANE" ]]; then
    command tmux set-option -p -t "$TMUX_PANE" @zsh_vi_mode "$vi_mode" 2>/dev/null
  fi
}

_vi_mode_clear() {
  if [[ -n "$TMUX_PANE" ]]; then
    command tmux set-option -p -u -t "$TMUX_PANE" @zsh_vi_mode 2>/dev/null
  fi
}

autoload -Uz add-zle-hook-widget
add-zle-hook-widget keymap-select _vi_cursor_shape
add-zle-hook-widget line-init _vi_cursor_shape
add-zle-hook-widget line-finish _vi_mode_clear

# --- Option+arrow / Option+Backspace word navigation (from macos.zsh) ---
bindkey "^[[1;3D" backward-word
bindkey "^[[1;3C" forward-word
bindkey "^[^?" backward-kill-word
bindkey "^[b" backward-word
bindkey "^[f" forward-word
bindkey "^[d" kill-word
